name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user-home
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          unzip -q FocusLauncher.zip -d p
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo -H env "JAVA_HOME=$JAVA_HOME" "$SDKM" --licenses >/dev/null 2>&1 || true
          sudo -H env "JAVA_HOME=$JAVA_HOME" "$SDKM" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          cd p
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../FocusLauncher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLauncher
          path: FocusLauncher.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" FocusLauncher.apk --title "Focus Launcher build ${{ github.run_number }}" --notes "Download FocusLauncher.apk and install it."
